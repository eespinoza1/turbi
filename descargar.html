<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Descarga la App de TURBI — iOS y Android</title>
<meta name="description" content="Descarga la aplicación de TURBI para iPhone (App Store) o Android (Google Play) y encuentra repuestos y autopartes en Venezuela.">
<link rel="canonical" href="https://turbi.com.ve/descargar.html">
<meta property="og:title" content="Descarga la App de TURBI">
<meta property="og:description" content="Repuestos y autopartes en Venezuela. Disponible para iOS y Android.">
<meta property="og:image" content="https://turbi.com.ve/logo.jpeg">
<meta property="og:url" content="https://turbi.com.ve/descargar.html">
<link rel="apple-touch-icon" href="logo.jpeg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@400;600;700;800&display=swap">
<style>
:root{
  --ink-950:#050505;--ink-900:#0a0a0a;--ink-800:#111111;--ink-700:#181818;
  --grad:linear-gradient(95deg,#FF004D 0%,#FF5E00 60%,#FFB800 100%);
  --font-d:'Bebas Neue',Impact,sans-serif;
  --font-s:'Manrope',system-ui,-apple-system,sans-serif;
  --line:rgba(255,255,255,.1);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:var(--font-s);background:var(--ink-900);color:#fff;
  min-height:100dvh;display:flex;align-items:center;justify-content:center;
  padding:28px 20px;
  background-image:radial-gradient(900px 500px at 50% -10%,rgba(255,0,77,.18),transparent 60%);
}
.card{
  width:100%;max-width:460px;background:var(--ink-800);
  border:1px solid var(--line);border-radius:24px;
  padding:40px 32px;text-align:center;
  box-shadow:0 30px 80px rgba(0,0,0,.6);
}
.logo{width:72px;height:72px;border-radius:18px;object-fit:cover;margin:0 auto 20px;display:block}
h1{font-family:var(--font-d);font-weight:400;font-size:40px;letter-spacing:.5px;line-height:1;margin-bottom:10px}
h1 .g{background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.sub{color:#b8b8b8;font-size:15px;line-height:1.5;margin-bottom:28px}
.btns{display:flex;flex-direction:column;gap:14px}
.store{
  display:flex;align-items:center;gap:14px;text-decoration:none;color:#fff;
  background:var(--ink-700);border:1px solid var(--line);border-radius:16px;
  padding:14px 18px;text-align:left;transition:transform .15s ease,border-color .15s ease;
}
.store:hover{transform:translateY(-2px);border-color:rgba(255,255,255,.28)}
.store svg{width:30px;height:30px;flex:0 0 30px}
.store .t{display:flex;flex-direction:column;line-height:1.2}
.store .t small{font-size:11px;color:#9a9a9a;text-transform:uppercase;letter-spacing:.6px}
.store .t b{font-size:17px;font-weight:700}
.store.primary{background:var(--grad);border:none}
.store.primary .t small{color:rgba(255,255,255,.85)}
.hint{margin-top:22px;font-size:12px;color:#777}
.foot{margin-top:18px}
.foot a{color:#FF5E00;text-decoration:none;font-size:13px;font-weight:600}
</style>
</head>
<body>
<main class="card">
  <img class="logo" src="logo.jpeg" alt="TURBI">
  <h1>Descarga <span class="g">TURBI</span></h1>
  <p class="sub">Repuestos y autopartes en Venezuela, al alcance de tu mano. Disponible para iPhone y Android.</p>

  <div class="btns" id="btns">
    <!-- App Store -->
    <a class="store" id="btn-ios" href="https://apps.apple.com/ve/app/turbi/id6808271081">
      <svg viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><path d="M16.37 1.43c.06 1.04-.36 2.06-1.02 2.79-.7.78-1.86 1.38-2.98 1.29-.08-1 .4-2.03 1.04-2.72.7-.77 1.94-1.35 2.96-1.36zM20.3 17.2c-.57 1.3-.84 1.88-1.57 3.03-1.02 1.6-2.46 3.6-4.25 3.62-1.58.01-1.99-1.03-4.14-1.02-2.14.01-2.59 1.04-4.18 1.03-1.78-.02-3.14-1.82-4.17-3.42C-.57 15.9-.97 10.65 1.07 7.85c1.08-1.5 2.78-2.38 4.38-2.38 1.63 0 2.65 1.04 4 1.04 1.3 0 2.1-1.04 4-1.04 1.42 0 2.93.77 4 2.1-3.52 1.93-2.94 6.96.85 9.63z"/></svg>
      <span class="t"><small>Descargar en la</small><b>App Store</b></span>
    </a>
    <!-- Google Play -->
    <a class="store" id="btn-android" href="https://play.google.com/store/apps/details?id=com.turbi.app">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path fill="#00D2FF" d="M3.6 1.8c-.3.3-.5.8-.5 1.4v17.6c0 .6.2 1.1.5 1.4l.1.1 9.9-9.9v-.8L3.7 1.7z"/>
        <path fill="#FFCE00" d="M17 15.6l-3.4-3.4v-.8l3.4-3.4.1.1 4 2.3c1.1.6 1.1 1.7 0 2.4l-4 2.3z"/>
        <path fill="#FF3A44" d="M17.1 15.5L13.6 12 3.6 22c.4.4 1 .4 1.7.1l11.8-6.7"/>
        <path fill="#00E676" d="M17.1 8.5L5.3 1.8c-.7-.4-1.3-.3-1.7.1l10 10z"/>
      </svg>
      <span class="t"><small>Disponible en</small><b>Google Play</b></span>
    </a>
  </div>

  <p class="hint" id="hint">Elige tu tienda según tu dispositivo.</p>
  <p class="foot"><a href="/">← Volver a turbi.com.ve</a></p>
</main>

<script>
(function(){
  var ua = navigator.userAgent || navigator.vendor || window.opera;
  var isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var isAndroid = /android/i.test(ua);
  var ios = document.getElementById('btn-ios');
  var android = document.getElementById('btn-android');
  var btns = document.getElementById('btns');
  var hint = document.getElementById('hint');

  if (isIOS) {
    ios.classList.add('primary');
    btns.insertBefore(ios, android);        // iOS primero
    hint.textContent = 'Detectamos que usas un iPhone o iPad.';
  } else if (isAndroid) {
    android.classList.add('primary');
    btns.insertBefore(android, ios);        // Android primero
    hint.textContent = 'Detectamos que usas un dispositivo Android.';
  }
})();
</script>
</body>
</html>
